name: iOS Personal Training App Build

on:
  workflow_dispatch:
    inputs:
      app_env:
        description: Build environment passed as APP_ENV
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

jobs:
  build-ios:
    runs-on: macos-14
    env:
      APP_DIR: examples/personal_training_app
      IOS_BUNDLE_ID: com.simtrainingpartner.simtrainingpartner
      APPLE_TEAM_ID: 5QHDS9AQFB
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APPLE_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      APPLE_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APPLE_STORE_CONNECT_API_KEY_BASE64 }}
      APP_STORE_CONNECT_CERTIFICATE_KEY: ${{ secrets.APP_STORE_CONNECT_CERTIFICATE_KEY }}
      IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
      IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
      IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Codemagic CLI tools
        run: |
          brew update
          brew install pipx
          pipx install codemagic-cli-tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Disable Swift Package Manager in CI
        run: flutter config --no-enable-swift-package-manager

      - name: Prepare iOS build directories
        run: |
          mkdir -p build/ios/SourcePackages
        working-directory: ${{ env.APP_DIR }}

      - name: Flutter pub get
        run: |
          if grep -q '^dependency_overrides:' pubspec.yaml; then
            if grep -q '^  device_info_plus:' pubspec.yaml; then
              sed -i '' -E "s/^  device_info_plus: .*/  device_info_plus: 11.2.0/" pubspec.yaml
            else
              printf '\n  device_info_plus: 11.2.0\n' >> pubspec.yaml
            fi
          else
            printf '\ndependency_overrides:\n  device_info_plus: 11.2.0\n' >> pubspec.yaml
          fi

          # Pin FlutterFire to a known-good patch set in CI.
          flutter pub add \
            firebase_core:4.11.0 \
            cloud_firestore:6.1.3 \
            firebase_auth:6.5.4 \
            firebase_database:12.4.4 \
            firebase_messaging:16.4.1 \
            firebase_app_check:0.4.5+2 || true
          flutter pub get
          flutter pub deps | grep -E "device_info_plus( |$)" || true
          flutter pub deps | grep -E "firebase_app_check( |$)" || true
          flutter pub deps | grep -E "cloud_firestore( |$)" || true
        working-directory: ${{ env.APP_DIR }}

      - name: Hotfix device_info_plus for Xcode 15.4
        run: |
          set -euo pipefail
          # device_info_plus 12.4.0 references isiOSAppOnVision, which is not
          # available in the Xcode 15.4 iOS SDK used by this workflow.
          while IFS= read -r -d '' f; do
            perl -0pi -e "s/isiOSAppOnVision\s*=\s*\[NSNumber numberWithBool:\[info isiOSAppOnVision\]\];/isiOSAppOnVision = @NO;/g" "$f"
            perl -0pi -e "s/\[info\s+isiOSAppOnVision\]/NO/g" "$f"
            perl -0pi -e "s/info\.isiOSAppOnVision/NO/g" "$f"
            perl -0pi -e "s/^\h*isiOSAppOnVision\h*=\h*.*?;\h*$/    isiOSAppOnVision = @NO;/mg" "$f"
            perl -0pi -e "s/isiOSAppOnVision\s*=\s*;/isiOSAppOnVision = @NO;/g" "$f"
            perl -0pi -e "s/natural_t\s+mem_free\s*=\s*vm_stat\.free_count\s*\*\s*page_size;/uint64_t mem_free = (uint64_t)vm_stat.free_count * (uint64_t)page_size;/g" "$f"
            echo "---- device_info_plus patched snippet ----"
            grep -nE "isiOSAppOnVision|mem_free|vm_stat\.free_count" "$f" || true
            echo "Patched: $f"
          done < <(find "$HOME/.pub-cache" "$PWD/ios/.symlinks" -type f -name 'FPPDeviceInfoPlusPlugin.m' -print0 2>/dev/null)
        working-directory: ${{ env.APP_DIR }}

      - name: Install CocoaPods dependencies
        run: |
          mkdir -p ios/Flutter
          if [ -f ios/Flutter/Release.xcconfig ] && ! grep -q 'Pods-Runner.release.xcconfig' ios/Flutter/Release.xcconfig; then
            cp ios/Flutter/Release.xcconfig ios/Flutter/Release.xcconfig.bak
            {
              echo '#include? "../Pods/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig"'
              cat ios/Flutter/Release.xcconfig.bak
            } > ios/Flutter/Release.xcconfig
          fi
          if [ -f ios/Flutter/Debug.xcconfig ] && ! grep -q 'Pods-Runner.debug.xcconfig' ios/Flutter/Debug.xcconfig; then
            cp ios/Flutter/Debug.xcconfig ios/Flutter/Debug.xcconfig.bak
            {
              echo '#include? "../Pods/Target Support Files/Pods-Runner/Pods-Runner.debug.xcconfig"'
              cat ios/Flutter/Debug.xcconfig.bak
            } > ios/Flutter/Debug.xcconfig
          fi
          if [ ! -f ios/Flutter/Profile.xcconfig ]; then
            printf '#include? "../Pods/Target Support Files/Pods-Runner/Pods-Runner.profile.xcconfig"\n#include "Generated.xcconfig"\n' > ios/Flutter/Profile.xcconfig
          elif ! grep -q 'Pods-Runner.profile.xcconfig' ios/Flutter/Profile.xcconfig; then
            cp ios/Flutter/Profile.xcconfig ios/Flutter/Profile.xcconfig.bak
            {
              echo '#include? "../Pods/Target Support Files/Pods-Runner/Pods-Runner.profile.xcconfig"'
              cat ios/Flutter/Profile.xcconfig.bak
            } > ios/Flutter/Profile.xcconfig
          fi

          if grep -qE "^platform :ios" ios/Podfile; then
            sed -i '' -E "s/^platform :ios, .*/platform :ios, '15.0'/" ios/Podfile
          else
            cp ios/Podfile ios/Podfile.bak
            {
              echo "platform :ios, '15.0'"
              cat ios/Podfile.bak
            } > ios/Podfile
          fi

          if grep -qE '^\$FirebaseSDKVersion\s*=' ios/Podfile; then
            sed -i '' -E "s/^\$FirebaseSDKVersion\s*=.*/\$FirebaseSDKVersion = '11.15.0'/" ios/Podfile
          else
            awk 'NR==1 {print; print "$FirebaseSDKVersion = '\''11.15.0'\''"; next} {print}' ios/Podfile > ios/Podfile.tmp
            mv ios/Podfile.tmp ios/Podfile
          fi

          # Build Firebase pods as frameworks to avoid static Swift module-map
          # integration failures across FirebaseSharedSwift/Auth/Firestore/AppCheck.
          sed -i '' -E '/^use_modular_headers!$/d' ios/Podfile
          sed -i '' -E '/^\s*pod\s+'\''(GoogleUtilities|RecaptchaInterop|GTMSessionFetcher|FirebaseAuthInterop|FirebaseAppCheckInterop|FirebaseCore|FirebaseCoreExtension|leveldb-library|FirebaseFirestoreInternal|FirebaseAppCheck)'\'',\s*:modular_headers\s*=>\s*true\s*$/d' ios/Podfile
          sed -i '' -E "s/^use_frameworks! :linkage => static$/use_frameworks! :linkage => :static/" ios/Podfile
          if ! grep -q '^use_frameworks! :linkage => :static$' ios/Podfile; then
            perl -0pi -e "s/(platform :ios, '15.0'\n)/\1use_frameworks! :linkage => :static\n/" ios/Podfile
          fi

          if ! grep -q "flutter_additional_ios_build_settings(target)" ios/Podfile; then
            perl -0pi -e "s/installer\.pods_project\.targets\.each do \|target\|/installer.pods_project.targets.each do |target|\n    flutter_additional_ios_build_settings(target)/" ios/Podfile
          fi

          head -n 20 ios/Podfile
          cd ios
          git config --global --unset-all http.sslBackend || true
          git config --global http.sslBackend secure-transport || true
          git config --global http.sslCAInfo /private/etc/ssl/cert.pem || true
          if ! pod install --repo-update; then
            echo "pod install failed with strict SSL; retrying once with GitHub SSL verify disabled"
            GIT_SSL_NO_VERIFY=1 pod install --repo-update
          fi
          sed -i '' "s/-Werror=non-modular-include-in-framework-module/-Wno-error=non-modular-include-in-framework-module/g" Pods/Pods.xcodeproj/project.pbxproj || true

          # Xcode 15.4 cannot parse newer ownership modifiers used by recent
          # Firebase Swift sources. Normalize signatures to Swift 5-compatible syntax.
          while IFS= read -r -d '' f; do
            perl -0pi -e "s/\bconsuming\s+sending\s+//g; s/\binout\s+sending\s+/inout /g; s/->\s*sending\s+/-> /g; s/\bborrowing\s+func\b/func/g; s/([(:]\s*)sending\s+/\1/g" "$f"
          done < <(find "$PWD/Pods" "$HOME/.pub-cache" -type f -name '*.swift' \( -path '*/Firebase*/*' -o -path '*/GoogleUtilities/*' -o -path '*/GTMSessionFetcher/*' -o -path '*/RecaptchaInterop/*' \) -print0 2>/dev/null)
          echo "---- Firebase Swift ownership keyword scan ----"
          grep -RInE "\b(sending|consuming|borrowing)\b" "$PWD/Pods/FirebaseCoreInternal" "$PWD/Pods/FirebaseSharedSwift" 2>/dev/null | head -n 80 || true

          # firebase_app_check may include Swift syntax/attributes that differ
          # across Xcode toolchains. Normalize generated Swift for CI stability.
          while IFS= read -r -d '' f; do
            perl -0pi -e "s/:\s*\@retroactive\s+Error/: Error/g; s/\bconsuming\s+sending\s+//g; s/\binout\s+sending\s+/inout /g; s/->\s*sending\s+/-> /g; s/\bborrowing\s+func\b/func/g; s/([(:]\s*)sending\s+/\1/g" "$f"
            perl -0pi -e "s/delegateProvider\s*=\s*RecaptchaProvider\(app:\s*app,\s*siteKey:\s*recaptchaSiteKey\)/delegateProvider = DeviceCheckProvider(app: app)/g; s/delegateProvider\s*=\s*RecaptchaProvider\(app:\s*app\)/delegateProvider = DeviceCheckProvider(app: app)/g" "$f"
            echo "---- firebase_app_check patch snippet: $f ----"
            grep -nE "@retroactive|sending|consuming|borrowing|extension FlutterError|RecaptchaProvider|DeviceCheckProvider" "$f" || true
          done < <(find "$HOME/.pub-cache" "$PWD/.symlinks" -type f -path '*/firebase_app_check*/Sources/firebase_app_check/*.swift' -print0 2>/dev/null)
        working-directory: ${{ env.APP_DIR }}

      - name: Prepare export options
        run: |
          cat > "$HOME/export_options.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Set up iOS signing
        run: |
          set -euo pipefail
          cd "$APP_DIR"

          # Prepare a temporary keychain for CI signing material.
          security create-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "" build.keychain
          security list-keychains -d user -s build.keychain login.keychain-db
          security default-keychain -d user -s build.keychain

          if [ -n "${IOS_DIST_P12_BASE64:-}" ] && [ -n "${IOS_MOBILEPROVISION_BASE64:-}" ]; then
            echo "Using direct distribution certificate/profile secrets"
            p12_path="$RUNNER_TEMP/dist.p12"
            profile_path="$RUNNER_TEMP/profile.mobileprovision"

            printf "%s" "$IOS_DIST_P12_BASE64" | tr -d ' \n\r\t' | base64 --decode > "$p12_path"
            printf "%s" "$IOS_MOBILEPROVISION_BASE64" | tr -d ' \n\r\t' | base64 --decode > "$profile_path"

            security import "$p12_path" -k build.keychain -P "${IOS_DIST_P12_PASSWORD:-}" -T /usr/bin/codesign -T /usr/bin/security
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/ci.mobileprovision"
          else
            echo "Direct cert/profile secrets not found. Falling back to App Store Connect fetch-signing-files."

            if [ -z "${APP_STORE_CONNECT_ISSUER_ID:-}" ]; then
              echo "Missing secret: APP_STORE_CONNECT_ISSUER_ID"
              exit 1
            fi
            if [ -z "${APP_STORE_CONNECT_KEY_IDENTIFIER:-}" ]; then
              echo "Missing secret: APPLE_STORE_CONNECT_API_KEY_ID"
              exit 1
            fi
            if [ -z "${APP_STORE_CONNECT_CERTIFICATE_KEY:-}" ]; then
              echo "Missing secret: APP_STORE_CONNECT_CERTIFICATE_KEY"
              exit 1
            fi

            asc_key_path="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"
            if [ -n "${APP_STORE_CONNECT_PRIVATE_KEY:-}" ] && printf "%s" "$APP_STORE_CONNECT_PRIVATE_KEY" | grep -q "BEGIN PRIVATE KEY"; then
              printf "%s" "$APP_STORE_CONNECT_PRIVATE_KEY" | sed 's/\\n/\n/g' > "$asc_key_path"
            elif [ -n "${APPLE_STORE_CONNECT_API_KEY_BASE64:-}" ] && printf "%s" "$APPLE_STORE_CONNECT_API_KEY_BASE64" | grep -q "BEGIN PRIVATE KEY"; then
              printf "%s" "$APPLE_STORE_CONNECT_API_KEY_BASE64" | sed 's/\\n/\n/g' > "$asc_key_path"
            elif [ -n "${APPLE_STORE_CONNECT_API_KEY_BASE64:-}" ]; then
              printf "%s" "$APPLE_STORE_CONNECT_API_KEY_BASE64" | tr -d ' \n\r\t' | base64 --decode > "$asc_key_path"
            else
              echo "Missing key secret: set APP_STORE_CONNECT_PRIVATE_KEY or APPLE_STORE_CONNECT_API_KEY_BASE64"
              exit 1
            fi

            cert_key_path="$RUNNER_TEMP/distribution_certificate.key"
            printf "%s" "$APP_STORE_CONNECT_CERTIFICATE_KEY" | sed 's/\\n/\n/g' > "$cert_key_path"

            keychain initialize
            app-store-connect fetch-signing-files \
              "$IOS_BUNDLE_ID" \
              --platform IOS \
              --type IOS_APP_STORE \
              --create \
              --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
              --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
              --private-key "@file:$asc_key_path" \
              --certificate-key "@file:$cert_key_path"
            keychain add-certificates -A
          fi

          profiles_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles_dir"

          # Some tooling fetches profiles outside the default folder. Install all
          # discovered .mobileprovision files into the canonical Xcode directory.
          while IFS= read -r -d '' profile; do
            cp "$profile" "$profiles_dir/$(basename "$profile")"
          done < <(find "$RUNNER_TEMP" "$PWD" "$HOME" -type f -name '*.mobileprovision' -print0 2>/dev/null)

          selected_profile_plist="$RUNNER_TEMP/selected-profile.plist"
          found_profile=false
          while IFS= read -r -d '' profile; do
            if ! security cms -D -i "$profile" > "$selected_profile_plist" 2>/dev/null; then
              continue
            fi
            profile_team=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$selected_profile_plist" 2>/dev/null || true)
            profile_app_id=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$selected_profile_plist" 2>/dev/null || true)
            profile_bundle_id="${profile_app_id#*.}"
            if [ "$profile_team" = "$APPLE_TEAM_ID" ] && [ "$profile_bundle_id" = "$IOS_BUNDLE_ID" ]; then
              profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$selected_profile_plist")
              profile_name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$selected_profile_plist")
              CI_PROFILE_UUID="$profile_uuid"
              CI_PROFILE_NAME="$profile_name"
              echo "CI_PROFILE_UUID=$profile_uuid" >> "$GITHUB_ENV"
              echo "CI_PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"
              echo "Selected provisioning profile: $profile_name ($profile_uuid)"
              found_profile=true
              break
            fi
          done < <(find "$profiles_dir" -type f -name '*.mobileprovision' -print0)

          if [ "$found_profile" != true ]; then
            echo "No provisioning profile matching team $APPLE_TEAM_ID and bundle $IOS_BUNDLE_ID was installed."
            exit 1
          fi

          # Apply selected profile mapping to Runner target build settings.
          xcode-project use-profiles \
            --project "ios/Runner.xcodeproj" \
            --archive-method app-store \
            --export-options-plist "$HOME/export_options.plist" \
            --custom-export-options '{"provisioningProfiles":{"'"$IOS_BUNDLE_ID"'":"'"$CI_PROFILE_NAME"'"}}' \
            --code-signing-setup-verbose-logging

          echo "==== Code signing identities ===="
          security find-identity -v -p codesigning || true
          echo "==== Provisioning profiles ===="
          ls -la "$profiles_dir" || true

      - name: Build iOS IPA for App Store
        run: |
          set -euo pipefail
          mkdir -p build/ios/SourcePackages
          : > "$RUNNER_TEMP/xcodebuild-archive.log"
          : > "$RUNNER_TEMP/xcodebuild-export.log"

          # Generate Flutter iOS configs without triggering a full build that can
          # rewrite CocoaPods integration immediately before archive.
          flutter build ios \
            --release \
            --config-only \
            --no-codesign \
            --dart-define=APP_ENV=${{ inputs.app_env }}

          if [ -f ios/Flutter/Release.xcconfig ] && ! grep -q 'Pods-Runner.release.xcconfig' ios/Flutter/Release.xcconfig; then
            cp ios/Flutter/Release.xcconfig ios/Flutter/Release.xcconfig.bak
            {
              echo '#include? "../Pods/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig"'
              cat ios/Flutter/Release.xcconfig.bak
            } > ios/Flutter/Release.xcconfig
          fi
          if [ ! -f ios/Flutter/Profile.xcconfig ]; then
            printf '#include? "../Pods/Target Support Files/Pods-Runner/Pods-Runner.profile.xcconfig"\n#include "Generated.xcconfig"\n' > ios/Flutter/Profile.xcconfig
          elif ! grep -q 'Pods-Runner.profile.xcconfig' ios/Flutter/Profile.xcconfig; then
            cp ios/Flutter/Profile.xcconfig ios/Flutter/Profile.xcconfig.bak
            {
              echo '#include? "../Pods/Target Support Files/Pods-Runner/Pods-Runner.profile.xcconfig"'
              cat ios/Flutter/Profile.xcconfig.bak
            } > ios/Flutter/Profile.xcconfig
          fi

          if grep -qE "^platform :ios" ios/Podfile; then
            sed -i '' -E "s/^platform :ios, .*/platform :ios, '15.0'/" ios/Podfile
          else
            cp ios/Podfile ios/Podfile.bak
            {
              echo "platform :ios, '15.0'"
              cat ios/Podfile.bak
            } > ios/Podfile
          fi

          if grep -qE '^\$FirebaseSDKVersion\s*=' ios/Podfile; then
            sed -i '' -E "s/^\$FirebaseSDKVersion\s*=.*/\$FirebaseSDKVersion = '11.15.0'/" ios/Podfile
          else
            awk 'NR==1 {print; print "$FirebaseSDKVersion = '\''11.15.0'\''"; next} {print}' ios/Podfile > ios/Podfile.tmp
            mv ios/Podfile.tmp ios/Podfile
          fi

          # Build Firebase pods as frameworks to avoid static Swift module-map
          # integration failures across FirebaseSharedSwift/Auth/Firestore/AppCheck.
          sed -i '' -E '/^use_modular_headers!$/d' ios/Podfile
          sed -i '' -E '/^\s*pod\s+'\''(GoogleUtilities|RecaptchaInterop|GTMSessionFetcher|FirebaseAuthInterop|FirebaseAppCheckInterop|FirebaseCore|FirebaseCoreExtension|leveldb-library|FirebaseFirestoreInternal|FirebaseAppCheck)'\'',\s*:modular_headers\s*=>\s*true\s*$/d' ios/Podfile
          sed -i '' -E "s/^use_frameworks! :linkage => static$/use_frameworks! :linkage => :static/" ios/Podfile
          if ! grep -q '^use_frameworks! :linkage => :static$' ios/Podfile; then
            perl -0pi -e "s/(platform :ios, '15.0'\n)/\1use_frameworks! :linkage => :static\n/" ios/Podfile
          fi

          if ! grep -q "flutter_additional_ios_build_settings(target)" ios/Podfile; then
            perl -0pi -e "s/installer\.pods_project\.targets\.each do \|target\|/installer.pods_project.targets.each do |target|\n    flutter_additional_ios_build_settings(target)/" ios/Podfile
          fi

          cd ios
          git config --global --unset-all http.sslBackend || true
          git config --global http.sslBackend secure-transport || true
          git config --global http.sslCAInfo /private/etc/ssl/cert.pem || true
          if ! pod install --repo-update; then
            echo "pod install failed with strict SSL; retrying once with GitHub SSL verify disabled"
            GIT_SSL_NO_VERIFY=1 pod install --repo-update
          fi
          sed -i '' "s/-Werror=non-modular-include-in-framework-module/-Wno-error=non-modular-include-in-framework-module/g" Pods/Pods.xcodeproj/project.pbxproj || true

          # Xcode 15.4 cannot parse newer ownership modifiers used by recent
          # Firebase Swift sources. Normalize signatures to Swift 5-compatible syntax.
          while IFS= read -r -d '' f; do
            perl -0pi -e "s/\bconsuming\s+sending\s+//g; s/\binout\s+sending\s+/inout /g; s/->\s*sending\s+/-> /g; s/\bborrowing\s+func\b/func/g; s/([(:]\s*)sending\s+/\1/g" "$f"
          done < <(find "$PWD/Pods" "$HOME/.pub-cache" -type f -name '*.swift' \( -path '*/Firebase*/*' -o -path '*/GoogleUtilities/*' -o -path '*/GTMSessionFetcher/*' -o -path '*/RecaptchaInterop/*' \) -print0 2>/dev/null)
          echo "---- Firebase Swift ownership keyword scan ----"
          grep -RInE "\b(sending|consuming|borrowing)\b" "$PWD/Pods/FirebaseCoreInternal" "$PWD/Pods/FirebaseSharedSwift" 2>/dev/null | head -n 80 || true

          # firebase_app_check may include Swift syntax/attributes that differ
          # across Xcode toolchains. Normalize generated Swift for CI stability.
          while IFS= read -r -d '' f; do
            perl -0pi -e "s/:\s*\@retroactive\s+Error/: Error/g; s/\bconsuming\s+sending\s+//g; s/\binout\s+sending\s+/inout /g; s/->\s*sending\s+/-> /g; s/\bborrowing\s+func\b/func/g; s/([(:]\s*)sending\s+/\1/g" "$f"
            perl -0pi -e "s/delegateProvider\s*=\s*RecaptchaProvider\(app:\s*app,\s*siteKey:\s*recaptchaSiteKey\)/delegateProvider = DeviceCheckProvider(app: app)/g; s/delegateProvider\s*=\s*RecaptchaProvider\(app:\s*app\)/delegateProvider = DeviceCheckProvider(app: app)/g" "$f"
            echo "---- firebase_app_check patch snippet: $f ----"
            grep -nE "@retroactive|sending|consuming|borrowing|extension FlutterError|RecaptchaProvider|DeviceCheckProvider" "$f" || true
          done < <(find "$HOME/.pub-cache" "$PWD/.symlinks" -type f -path '*/firebase_app_check*/Sources/firebase_app_check/*.swift' -print0 2>/dev/null)

          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]\+;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" Pods/Pods.xcodeproj/project.pbxproj

          # Re-apply device_info_plus hotfix after all regeneration/install steps.
          while IFS= read -r -d '' f; do
            perl -0pi -e "s/isiOSAppOnVision\s*=\s*\[NSNumber numberWithBool:\[info isiOSAppOnVision\]\];/isiOSAppOnVision = @NO;/g" "$f"
            perl -0pi -e "s/\[info\s+isiOSAppOnVision\]/NO/g" "$f"
            perl -0pi -e "s/info\.isiOSAppOnVision/NO/g" "$f"
            perl -0pi -e "s/^\h*isiOSAppOnVision\h*=\h*.*?;\h*$/    isiOSAppOnVision = @NO;/mg" "$f"
            perl -0pi -e "s/isiOSAppOnVision\s*=\s*;/isiOSAppOnVision = @NO;/g" "$f"
            perl -0pi -e "s/natural_t\s+mem_free\s*=\s*vm_stat\.free_count\s*\*\s*page_size;/uint64_t mem_free = (uint64_t)vm_stat.free_count * (uint64_t)page_size;/g" "$f"
            echo "---- device_info_plus final snippet ----"
            grep -nE "isiOSAppOnVision|mem_free|vm_stat\.free_count" "$f" || true
            if grep -Eq "\[info[[:space:]]+isiOSAppOnVision\]|info\.isiOSAppOnVision|isiOSAppOnVision\s*=\s*;" "$f"; then
              echo "Unpatched isiOSAppOnVision API usage remains in $f"
              exit 1
            fi
          done < <(find "$HOME/.pub-cache" "$PWD/.symlinks" -type f -name 'FPPDeviceInfoPlusPlugin.m' -print0 2>/dev/null)

          # Make health plugin Swift header import robust across modular/non-modular pod builds.
          while IFS= read -r -d '' f; do
            if ! grep -q '__has_include(<health/health-Swift.h>)' "$f"; then
              perl -0pi -e 's/#import <health\/health-Swift\.h>/#if __has_include(<health\/health-Swift.h>)\n#import <health\/health-Swift.h>\n#else\n#import "health-Swift.h"\n#endif/g' "$f"
            fi
            echo "---- health plugin import snippet ----"
            grep -nE "health-Swift\.h|__has_include" "$f" || true
          done < <(find "$HOME/.pub-cache" "$PWD/.symlinks" -type f -name 'HealthPlugin.m' -print0 2>/dev/null)

          # cloud_firestore uses a direct execution_time selector that is not
          # declared in the current FirebaseFirestore Objective-C headers.
          while IFS= read -r -d '' f; do
            perl -0pi -e 's/\[snapshot execution_time\]/[snapshot valueForKey:@"execution_time"]/g' "$f"
            echo "---- cloud_firestore execution_time snippet ----"
            grep -nE 'execution_time|valueForKey:@"execution_time"' "$f" || true
          done < <(find "$HOME/.pub-cache" "$PWD/.symlinks" -type f -name 'FLTFirebaseFirestorePlugin.m' -print0 2>/dev/null)

          # cloud_firestore uses a direct execution_time selector that is not
          # declared in the current FirebaseFirestore Objective-C headers.
          while IFS= read -r -d '' f; do
            perl -0pi -e 's/\[snapshot execution_time\]/[snapshot valueForKey:@"execution_time"]/g' "$f"
            echo "---- cloud_firestore execution_time snippet ----"
            grep -nE 'execution_time|valueForKey:@"execution_time"' "$f" || true
          done < <(find "$HOME/.pub-cache" "$PWD/.symlinks" -type f -name 'FLTFirebaseFirestorePlugin.m' -print0 2>/dev/null)

          # Ensure stale automatic signing flags do not block manual profile mapping.
          sed -i '' -E 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$HOME/export_options.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$IOS_BUNDLE_ID string $CI_PROFILE_NAME" "$HOME/export_options.plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:$IOS_BUNDLE_ID $CI_PROFILE_NAME" "$HOME/export_options.plist"
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -showBuildSettings | grep -E "CODE_SIGN_STYLE|PROVISIONING_PROFILE|PROVISIONING_PROFILE_SPECIFIER|DEVELOPMENT_TEAM|PRODUCT_BUNDLE_IDENTIFIER" || true

          if ! xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -jobs 1 \
            -archivePath ../build/ios/archive/Runner.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            archive > "$RUNNER_TEMP/xcodebuild-archive.log" 2>&1; then
            echo "==== xcodebuild archive error lines ===="
            grep -niE "(^|[^A-Za-z])(fatal error:|error:|\*\* ARCHIVE FAILED \*\*|Command PhaseScriptExecution failed|Swift Compiler Error)" "$RUNNER_TEMP/xcodebuild-archive.log" || true
            echo "==== Firebase Swift focused errors ===="
            grep -niE "FirebaseSharedSwift|FirebaseCoreInternal|SwiftCompile|CompileSwift|sending|consuming|borrowing|error:" "$RUNNER_TEMP/xcodebuild-archive.log" | tail -n 300 || true
            echo "==== xcodebuild archive tail ===="
            tail -n 500 "$RUNNER_TEMP/xcodebuild-archive.log" || true
            exit 1
          fi
          echo "xcodebuild archive succeeded"

          if ! xcodebuild -exportArchive \
            -archivePath ../build/ios/archive/Runner.xcarchive \
            -exportPath ../build/ios/ipa \
            -exportOptionsPlist "$HOME/export_options.plist" > "$RUNNER_TEMP/xcodebuild-export.log" 2>&1; then
            echo "==== xcodebuild export error lines ===="
            grep -niE "(^|[^A-Za-z])(fatal error:|error:|\*\* EXPORT FAILED \*\*|Command PhaseScriptExecution failed|Swift Compiler Error)" "$RUNNER_TEMP/xcodebuild-export.log" || true
            echo "==== xcodebuild export tail ===="
            tail -n 500 "$RUNNER_TEMP/xcodebuild-export.log" || true
            exit 1
          fi
          echo "xcodebuild export succeeded"
        working-directory: ${{ env.APP_DIR }}

      - name: Upload xcodebuild logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs-${{ inputs.app_env }}
          path: |
            ${{ runner.temp }}/xcodebuild-archive.log
            ${{ runner.temp }}/xcodebuild-export.log
          if-no-files-found: ignore

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-ipa-${{ inputs.app_env }}
          path: ${{ env.APP_DIR }}/build/ios/ipa/*.ipa
          if-no-files-found: error
